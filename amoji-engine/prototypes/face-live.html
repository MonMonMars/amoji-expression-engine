<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amoji Face Live — Realtime Expression</title>
    <style>
      :root {
        --bg0: #0c1116;
        --bg1: #152028;
        --ink: #edf3f8;
        --muted: #8fa3b5;
        --line: #2a3a48;
        --accent: #5ee0a8;
        --accent2: #f0b429;
        --danger: #ff6b6b;
        --panel: color-mix(in oklab, #121a22 92%, black);
        font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--ink); }
      body {
        display: grid;
        grid-template-columns: 1fr min(360px, 38vw);
        min-height: 100%;
        background:
          radial-gradient(900px 500px at 15% 0%, #1c3340 0%, transparent 55%),
          radial-gradient(700px 420px at 90% 10%, #2a2818 0%, transparent 45%),
          var(--bg0);
      }
      @media (max-width: 900px) {
        body { grid-template-columns: 1fr; grid-template-rows: min(55vh, 520px) 1fr; }
      }
      #viewport {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      .hud {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .pill {
        pointer-events: none;
        background: rgba(8, 12, 16, 0.72);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        backdrop-filter: blur(8px);
      }
      .pill strong { color: var(--accent); font-weight: 600; }
      aside {
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 18px 16px 28px;
        overflow: auto;
        display: grid;
        gap: 16px;
        align-content: start;
      }
      h1 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: 0.02em;
        font-weight: 650;
      }
      .sub { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
      .group { display: grid; gap: 10px; }
      .label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: #0d141a;
        padding: 4px;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      .seg button, .emo button, .row button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
      }
      .seg button.active {
        background: linear-gradient(180deg, #243442, #1a2732);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px #355066;
      }
      .emo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .emo button {
        background: #121a22;
        border: 1px solid var(--line);
        text-align: left;
      }
      .emo button.active {
        border-color: color-mix(in oklab, var(--accent) 55%, var(--line));
        background: color-mix(in oklab, #163328 70%, #121a22);
        color: var(--accent);
      }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .row { display: flex; gap: 8px; }
      .row button {
        flex: 1;
        background: #121a22;
        border: 1px solid var(--line);
      }
      .row button.primary {
        background: linear-gradient(180deg, #1d4a38, #163328);
        border-color: #2f6b52;
        color: var(--accent);
      }
      .meter {
        height: 8px;
        border-radius: 999px;
        background: #0d141a;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .meter > i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
      }
      pre {
        margin: 0;
        padding: 10px;
        background: #0d141a;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
        font-size: 0.72rem;
        max-height: 140px;
        overflow: auto;
      }
      .status { font-size: 0.8rem; color: var(--muted); }
      .status.ok { color: var(--accent); }
      .status.bad { color: var(--danger); }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div class="hud">
        <div class="pill">LOD <strong id="hudLod">—</strong></div>
        <div class="pill">Tris ≈ <strong id="hudTris">—</strong></div>
        <div class="pill">Emotion <strong id="hudEmo">neutral</strong></div>
        <div class="pill">FPS <strong id="hudFps">—</strong></div>
      </div>
    </div>
    <aside>
      <div>
        <h1>Amoji Face Live</h1>
        <p class="sub">Realtime facial expression on Sakura LO / HI meshes. Drag to orbit · scroll to zoom.</p>
      </div>

      <div class="group">
        <div class="label">Mesh LOD</div>
        <div class="seg" id="lodSeg">
          <button type="button" data-lod="lo">Low poly</button>
          <button type="button" data-lod="hi" class="active">High poly</button>
        </div>
        <div class="status" id="loadStatus">Loading…</div>
      </div>

      <div class="group">
        <div class="label">Emotion</div>
        <div class="emo" id="emoGrid"></div>
      </div>

      <div class="group">
        <div class="label">Intensity <span id="intensityVal">0.70</span></div>
        <input id="intensity" type="range" min="0" max="1.25" step="0.01" value="0.70" />
        <div class="meter"><i id="intensityMeter"></i></div>
      </div>

      <div class="group">
        <div class="label">Motion test</div>
        <div class="row">
          <button type="button" id="btnIdle" class="primary">Idle sway</button>
          <button type="button" id="btnSpin">Turntable</button>
        </div>
        <div class="row">
          <button type="button" id="btnCycle">Cycle emotions</button>
          <button type="button" id="btnBlink">Blink</button>
        </div>
      </div>

      <div class="group">
        <div class="label">Active morphs</div>
        <pre id="morphDebug">—</pre>
      </div>
    </aside>

    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import {
        EMOTIONS,
        emotionToMorphWeights,
        applyMorphWeights,
      } from '/engine/layers/emotionMorphs.js';

      const ASSETS = {
        lo: '/assets/characters/jp-female-v0/lod/sakura_lo.glb',
        hi: '/assets/characters/jp-female-v0/lod/sakura_hi.glb',
      };

      const viewport = document.getElementById('viewport');
      const loadStatus = document.getElementById('loadStatus');
      const morphDebug = document.getElementById('morphDebug');
      const intensityEl = document.getElementById('intensity');
      const intensityVal = document.getElementById('intensityVal');
      const intensityMeter = document.getElementById('intensityMeter');

      let lod = 'hi';
      let emotion = 'happy';
      let intensity = 0.7;
      let idleOn = true;
      let spinOn = false;
      let cycleOn = false;
      let blinkT = 0;
      let cycleT = 0;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c1116);
      const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
      camera.position.set(0.35, 1.45, 2.6);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      viewport.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.35, 0);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xb7c4d0, 0.55));
      const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
      key.position.set(2.2, 3.5, 2.5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xa8c4ff, 0.7);
      fill.position.set(-2.5, 1.8, -1.2);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xffffff, 0.55);
      rim.position.set(0.2, 2.2, -2.8);
      scene.add(rim);

      const root = new THREE.Group();
      scene.add(root);
      const loader = new GLTFLoader();
      /** @type {THREE.Object3D | null} */
      let model = null;
      /** @type {THREE.Mesh[]} */
      let morphMeshes = [];
      let mixer = null;
      let clock = new THREE.Clock();
      let frames = 0;
      let fpsT = 0;

      function resize() {
        const w = viewport.clientWidth;
        const h = viewport.clientHeight;
        camera.aspect = w / Math.max(h, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      window.addEventListener('resize', resize);
      resize();

      function collectMorphMeshes(obj) {
        const list = [];
        obj.traverse((c) => {
          if (c.isMesh && c.morphTargetDictionary && c.morphTargetInfluences) {
            list.push(c);
            c.frustumCulled = false;
          }
        });
        return list;
      }

      function estimateTris(obj) {
        let tris = 0;
        obj.traverse((c) => {
          if (!c.isMesh || !c.geometry) return;
          const g = c.geometry;
          const idx = g.index;
          tris += idx ? idx.count / 3 : g.attributes.position.count / 3;
        });
        return Math.round(tris);
      }

      async function loadLod(next) {
        loadStatus.textContent = `Loading ${next.toUpperCase()}…`;
        loadStatus.className = 'status';
        const gltf = await loader.loadAsync(ASSETS[next]);
        if (model) {
          root.remove(model);
          model.traverse((c) => {
            if (c.isMesh) {
              c.geometry?.dispose?.();
              const mats = Array.isArray(c.material) ? c.material : [c.material];
              mats.forEach((m) => m?.dispose?.());
            }
          });
        }
        model = gltf.scene;
        // Center / ground-ish
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.x -= center.x;
        model.position.z -= center.z;
        model.position.y -= box.min.y;
        root.add(model);
        morphMeshes = collectMorphMeshes(model);
        mixer = gltf.animations?.length
          ? new THREE.AnimationMixer(model)
          : null;
        if (mixer && gltf.animations[0]) {
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }
        controls.target.set(0, Math.min(size.y * 0.72, 1.55), 0);
        camera.position.set(0.25, controls.target.y + 0.1, Math.max(size.y * 1.5, 2.1));
        controls.update();

        lod = next;
        document.getElementById('hudLod').textContent = lod.toUpperCase();
        document.getElementById('hudTris').textContent = estimateTris(model).toLocaleString();
        document.querySelectorAll('#lodSeg button').forEach((b) => {
          b.classList.toggle('active', b.dataset.lod === lod);
        });
        loadStatus.textContent = `${lod.toUpperCase()} ready · ${morphMeshes.length} morph mesh(es)`;
        loadStatus.className = 'status ok';
      }

      function availableMorphs() {
        const names = new Set();
        for (const m of morphMeshes) {
          Object.keys(m.morphTargetDictionary || {}).forEach((n) => names.add(n));
        }
        return [...names];
      }

      function currentTargets() {
        return emotionToMorphWeights(lod, emotion, intensity, availableMorphs());
      }

      function forceBlink() {
        blinkT = 0.18;
      }

      // UI emotions
      const emoGrid = document.getElementById('emoGrid');
      for (const e of EMOTIONS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = e.replace('_', ' ');
        b.dataset.emo = e;
        if (e === emotion) b.classList.add('active');
        b.addEventListener('click', () => {
          emotion = e;
          document.querySelectorAll('#emoGrid button').forEach((x) => {
            x.classList.toggle('active', x.dataset.emo === emotion);
          });
          document.getElementById('hudEmo').textContent = emotion;
        });
        emoGrid.appendChild(b);
      }

      document.getElementById('lodSeg').addEventListener('click', async (ev) => {
        const btn = ev.target.closest('button[data-lod]');
        if (!btn) return;
        try {
          await loadLod(btn.dataset.lod);
        } catch (err) {
          loadStatus.textContent = String(err);
          loadStatus.className = 'status bad';
        }
      });

      intensityEl.addEventListener('input', () => {
        intensity = Number(intensityEl.value);
        intensityVal.textContent = intensity.toFixed(2);
        intensityMeter.style.width = `${Math.min(100, (intensity / 1.25) * 100)}%`;
      });
      intensityEl.dispatchEvent(new Event('input'));

      document.getElementById('btnIdle').addEventListener('click', (e) => {
        idleOn = !idleOn;
        e.currentTarget.classList.toggle('primary', idleOn);
      });
      document.getElementById('btnSpin').addEventListener('click', (e) => {
        spinOn = !spinOn;
        e.currentTarget.classList.toggle('primary', spinOn);
      });
      document.getElementById('btnCycle').addEventListener('click', (e) => {
        cycleOn = !cycleOn;
        e.currentTarget.classList.toggle('primary', cycleOn);
      });
      document.getElementById('btnBlink').addEventListener('click', forceBlink);

      function tick() {
        const dt = clock.getDelta();
        frames += 1;
        fpsT += dt;
        if (fpsT >= 0.5) {
          document.getElementById('hudFps').textContent = String(Math.round(frames / fpsT));
          frames = 0;
          fpsT = 0;
        }

        if (cycleOn) {
          cycleT += dt;
          if (cycleT > 1.6) {
            cycleT = 0;
            const list = EMOTIONS.filter((e) => e !== 'neutral');
            const idx = list.indexOf(emotion);
            emotion = list[(idx + 1) % list.length];
            document.querySelectorAll('#emoGrid button').forEach((x) => {
              x.classList.toggle('active', x.dataset.emo === emotion);
            });
            document.getElementById('hudEmo').textContent = emotion;
          }
        }

        // Naughty Dog: idle motion overlays emotion — does not replace it.
        if (spinOn && model) model.rotation.y += dt * 0.6;
        if (idleOn && model && !mixer) {
          const t = clock.elapsedTime;
          model.rotation.y = Math.sin(t * 0.7) * 0.15;
          model.position.y = Math.sin(t * 1.4) * 0.01;
        }
        if (mixer) mixer.update(dt);

        if (blinkT > 0) blinkT = Math.max(0, blinkT - dt);
        else if (Math.random() < dt * 0.25) blinkT = 0.14;

        const targets = currentTargets();
        const morphs = availableMorphs();

        // ND/Capcom eyes: micro saccades on top of expression (HI only)
        if (lod === 'hi' && idleOn) {
          const t = clock.elapsedTime;
          const sx = (Math.sin(t * 3.1) * 0.5 + Math.sin(t * 5.7) * 0.5) * 0.12;
          const sy = Math.sin(t * 2.4 + 1.7) * 0.08;
          if (morphs.includes('Expressions_eyesHoriz_max') && sx > 0) {
            targets.Expressions_eyesHoriz_max = Math.max(targets.Expressions_eyesHoriz_max || 0, sx);
          }
          if (morphs.includes('Expressions_eyesHoriz_min') && sx < 0) {
            targets.Expressions_eyesHoriz_min = Math.max(targets.Expressions_eyesHoriz_min || 0, -sx);
          }
          if (morphs.includes('Expressions_eyesVert_max') && sy > 0) {
            targets.Expressions_eyesVert_max = Math.max(targets.Expressions_eyesVert_max || 0, sy);
          }
          if (morphs.includes('Expressions_eyesVert_min') && sy < 0) {
            targets.Expressions_eyesVert_min = Math.max(targets.Expressions_eyesVert_min || 0, -sy);
          }
        }

        if (blinkT > 0) {
          const w = Math.sin((1 - blinkT / 0.18) * Math.PI);
          for (const name of [
            'Expressions_eyeClosedL_max',
            'Expressions_eyeClosedR_max',
          ]) {
            if (morphs.includes(name)) {
              targets[name] = Math.max(targets[name] || 0, w);
            }
          }
        }

        for (const mesh of morphMeshes) {
          applyMorphWeights(mesh, targets, 1 - Math.pow(0.001, dt));
        }

        const entries = Object.entries(targets)
          .filter(([, v]) => v > 0.01)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 10)
          .map(([k, v]) => `${k}: ${v.toFixed(2)}`);
        morphDebug.textContent = entries.length ? entries.join('\n') : '(neutral)';

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      try {
        await loadLod('hi');
        document.getElementById('hudEmo').textContent = emotion;
        tick();
      } catch (err) {
        loadStatus.textContent = String(err);
        loadStatus.className = 'status bad';
        console.error(err);
      }
    </script>
  </body>
</html>
